services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-tracker-postgres
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
