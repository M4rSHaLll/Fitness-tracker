services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-tracker-postgres
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness_tracker
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://fitness:fitness@postgres:5432/fitness_tracker?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness-tracker-app
    environment:
      APP_ENV: docker
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://fitness:fitness@postgres:5432/fitness_tracker?sslmode=disable
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-local-internal-token}
      API_TOKEN: ${API_TOKEN:-change-me-local-api-token}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: polling
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-postgres,localhost,127.0.0.1}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
